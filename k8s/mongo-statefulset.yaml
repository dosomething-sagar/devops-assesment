apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: production
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:6
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          requests:
            memory: '256Mi'
            cpu: '100m'
          limits:
            memory: '512Mi'
            cpu: '500m'
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ 'ReadWriteOnce' ]
      storageClassName: gp2
      resources:
        requests:
          storage: 5Gi
