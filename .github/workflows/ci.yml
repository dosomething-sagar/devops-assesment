name: CI — DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test

      - name: Trivy filesystem scan (fast, pre-build check)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

      - name: Check Jenkins secrets
        id: jenkins
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.JENKINS_URL }}" ] && [ -n "${{ secrets.JENKINS_USER }}" ] && [ -n "${{ secrets.JENKINS_TOKEN }}" ]; then
            echo "run_jenkins=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_jenkins=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Jenkins trigger because one or more required secrets are not configured."
          fi

      - name: Trigger Jenkins build
        if: steps.jenkins.outputs.run_jenkins == 'true'
        run: |
          curl -X POST \
            "${{ secrets.JENKINS_URL }}/job/devops-pipeline/build" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode json='{"parameter": []}'
